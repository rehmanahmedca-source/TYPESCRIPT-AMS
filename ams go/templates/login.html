{{define "login"}}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMS · Sign in</title><style>body{font:16px system-ui;background:#f4f6f8;display:grid;place-items:center;height:100vh}.card{background:#fff;padding:2rem;border-radius:12px;box-shadow:0 8px 30px #0001;width:min(360px,90vw)}label{display:block;margin:.8rem 0 .25rem}input,button{box-sizing:border-box;width:100%;padding:.7rem;border:1px solid #ccd3da;border-radius:6px}button{margin-top:1.2rem;background:#1769aa;color:#fff;border:0;cursor:pointer}.error{color:#b42318}</style></head><body><main class="card"><h1>Ahmed Material System</h1>{{if .Error}}<p class="error">{{.Error}}</p>{{end}}<form method="post" action="/login"><label>Username</label><input name="username" autocomplete="username" required><label>Password</label><input type="password" name="password" autocomplete="current-password" required><button>Sign in</button></form></main></body></html>{{end}}
